biography:
  - I am an Economist, Market Analyst, and Emerging Data Scientist with over a decade of combined experience in strategic banking research, financial market analysis, and academia. My current research interests lie at the intersection of applied microeconometrics and behavioural economics. I leverage quasi-experiments to identify the causal effects of exogenous shocks across diverse contexts.
  - I am also skilled in macroeconomic analysis and forecasting, market intelligence, business analytics, economic consulting and reporting, with proven expertise in transforming complex data into actionable insights for executive-level decision-making.
